<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问卷填写</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --bg-soft: #ffffff;
      --panel: #ffffff;
      --panel-dark: #ffffff;
      --text: #1f2329;
      --text-soft: #646a73;
      --text-light: #1f2329;
      --text-light-soft: #646a73;
      --line: #e5e6eb;
      --line-dark: #e5e6eb;
      --brand: #2f6bff;
      --brand-2: #2f6bff;
      --danger: #e25270;
      --radius-xl: 16px;
      --radius-lg: 14px;
      --radius-md: 12px;
      --shadow: 0 8px 24px rgba(31, 35, 41, 0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      --app-max-width: 760px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font); }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 48px;
    }
    body[data-style-pack="consumer-polished"] {
      --bg: #f6f7fb;
      --bg-soft: #ffffff;
      --panel: #ffffff;
      --text: #181c25;
      --text-soft: #5f6778;
      --text-light: #181c25;
      --text-light-soft: #5f6778;
      --line: #e7eaf1;
      --line-dark: #e7eaf1;
      --brand: #4b6bff;
      --brand-2: #7a8fff;
      --radius-xl: 18px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow: 0 12px 30px rgba(20, 28, 45, 0.08);
      --app-max-width: 820px;
    }
    body[data-style-pack="consumer-trust"] {
      --bg: #f5f7fa;
      --bg-soft: #f9fbfe;
      --panel: #ffffff;
      --text: #1d2433;
      --text-soft: #667085;
      --text-light: #1d2433;
      --text-light-soft: #667085;
      --line: #e7ecf3;
      --line-dark: #e7ecf3;
      --brand: #2f6bff;
      --brand-2: #4f8bff;
      --radius-xl: 16px;
      --radius-lg: 14px;
      --radius-md: 12px;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
      --app-max-width: 820px;
    }
    body[data-style-pack="consumer-editorial"] {
      --bg: #f8f7f5;
      --bg-soft: #fffdfa;
      --panel: #ffffff;
      --text: #22201d;
      --text-soft: #6f675f;
      --text-light: #22201d;
      --text-light-soft: #6f675f;
      --line: #eee8df;
      --line-dark: #eee8df;
      --brand: #eb5b6a;
      --brand-2: #f08b76;
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow: 0 8px 24px rgba(54, 38, 24, 0.06);
      --app-max-width: 760px;
    }
    body[data-style-pack="consumer-utility"] {
      --bg: #f9f9f9;
      --bg-soft: #ffffff;
      --panel: #ffffff;
      --text: #0f0f0f;
      --text-soft: #606060;
      --text-light: #0f0f0f;
      --text-light-soft: #606060;
      --line: #e5e5e5;
      --line-dark: #e5e5e5;
      --brand: #111111;
      --brand-2: #2d2d2d;
      --radius-xl: 14px;
      --radius-lg: 12px;
      --radius-md: 10px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
      --app-max-width: 780px;
    }
    body[data-style-pack="consumer-campaign"] {
      --bg: #ffffff;
      --bg-soft: #f8f7fb;
      --panel: #ffffff;
      --panel-dark: #ffffff;
      --text: #000000;
      --text-soft: #595566;
      --text-light: #000000;
      --text-light-soft: #595566;
      --line: #ece9f3;
      --line-dark: #ece9f3;
      --brand: #000000;
      --brand-2: #863dfb;
      --danger: #db2f57;
      --radius-xl: 26px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow: 0 20px 48px rgba(20, 10, 40, 0.08);
      --app-max-width: 860px;
    }
    .app { width: 100%; max-width: var(--app-max-width); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: var(--text-soft);
      font-size: 12px;
      letter-spacing: 0;
    }
    .progress {
      flex: 1;
      min-width: 120px;
      height: 8px;
      border-radius: 999px;
      background: rgba(47,107,255,.10);
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--brand);
      transition: width .24s ease;
    }
    .progress-caption {
      margin: 6px 0 18px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-soft);
    }
    .screen { display: none; }
    .screen.is-active { display: block; }
    .card {
      width: 100%;
      border-radius: var(--radius-xl);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card.dark {
      background: var(--panel);
      color: var(--text);
      border-color: var(--line);
    }
    .card-body {
      padding: 24px 20px;
      display: grid;
      gap: 16px;
    }
    .survey-hero,
    .finish-state {
      display: grid;
      gap: 18px;
    }
    .survey-kicker,
    .finish-kicker {
      display: inline-flex;
      width: fit-content;
      min-height: 28px;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(47,107,255,.10);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .finish-badge {
      display: inline-flex;
      width: fit-content;
      min-height: 30px;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(46, 160, 67, 0.10);
      color: #1c7c38;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
    }
    .survey-hero-copy,
    .finish-copy,
    .question-main {
      display: grid;
      gap: 8px;
    }
    .trust-meta-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .survey-reason-list {
      display: grid;
      gap: 10px;
    }
    .survey-reason-item {
      position: relative;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-soft);
    }
    .survey-reason-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--brand);
    }
    .trust-meta-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--bg-soft);
      padding: 14px 16px;
      display: grid;
      gap: 6px;
    }
    .trust-meta-item strong {
      font-size: 13px;
      line-height: 1.5;
    }
    .trust-meta-item span,
    .finish-note {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-soft);
    }
    .finish-submit-status {
      display: none;
    }
    .finish-submit-status.is-visible {
      display: block;
    }
    .submit-status-card {
      display: grid;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(46, 160, 67, 0.24);
      border-radius: 16px;
      background: rgba(46, 160, 67, 0.08);
    }
    .submit-status-text {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
    }
    .dark .submit-status-text {
      color: var(--text-light);
    }
    .submit-status-actions {
      display: flex;
      justify-content: flex-start;
    }
    .resume-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(8px);
      z-index: 999;
    }
    .resume-overlay.is-visible {
      display: flex;
    }
    .resume-dialog {
      width: min(100%, 480px);
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
      padding: 24px;
      display: grid;
      gap: 14px;
    }
    .resume-dialog-kicker {
      display: inline-flex;
      width: fit-content;
      padding: 0 12px;
      min-height: 28px;
      border-radius: 999px;
      align-items: center;
      background: rgba(91,124,255,.10);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .resume-dialog-title {
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      margin: 0;
    }
    .resume-dialog-desc {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-soft);
      margin: 0;
    }
    .resume-dialog-meta {
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-soft);
    }
    .resume-dialog-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .resume-dialog-actions .btn {
      width: 100%;
      justify-content: center;
    }
    .dark .resume-dialog {
      background: var(--panel);
      color: var(--text-light);
      border-color: var(--line);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38);
    }
    .dark .resume-dialog-desc,
    .dark .resume-dialog-meta {
      color: var(--text-light-soft);
    }
    .hero-grid, .finish-grid {
      grid-template-columns: 1fr;
      align-items: start;
    }
    .question-head,
    .question-stage-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .question-index {
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .rich h1, .rich h2, .rich h3, .rich h4, .rich p, .rich ul, .rich ol, .rich blockquote { margin-top: 0; }
    .rich h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.02em; margin-bottom: 10px; }
    .rich h2 { font-size: 22px; line-height: 1.35; letter-spacing: -.01em; margin-bottom: 10px; }
    .rich h3 { font-size: 22px; line-height: 1.24; margin-bottom: 10px; }
    .rich p, .rich li, .rich blockquote { font-size: 14px; line-height: 1.75; color: var(--text-soft); }
    .dark .rich p, .dark .rich li, .dark .rich blockquote { color: var(--text-light-soft); }
    .rich a { color: var(--brand); text-decoration: none; border-bottom: 1px solid rgba(91,124,255,.35); }
    .rich code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(91,124,255,.1);
      color: inherit;
      font-size: 13px;
    }
    .meta-grid,
    .question-content { display: grid; gap: 12px; }
    .meta {
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      background: #fafbfc;
      padding: 16px;
    }
    .dark .meta {
      border-color: var(--line-dark);
      background: rgba(255,255,255,.04);
    }
    .meta strong { display: block; margin-bottom: 8px; }
    .meta span { display: block; font-size: 13px; line-height: 1.7; opacity: .76; }
    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f2f3f5;
      color: var(--text-soft);
      font-size: 12px;
      padding: 8px 10px;
    }
    .chip.warn {
      color: #b96f15;
      background: rgba(217,156,50,.1);
    }
    .required { color: var(--danger); margin-left: 4px; }
    .media-stack {
      display: grid;
      gap: 10px;
    }
    .media-stack--survey,
    .media-stack--finish {
      grid-template-columns: 1fr;
    }
    .media-stack--question,
    .media-stack--option {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .hero-media-wrap,
    .question-media-wrap,
    .finish-media-wrap,
    .option-media-wrap {
      display: grid;
      gap: 10px;
    }
    .media-card {
      min-width: 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fafbfc;
      padding: 12px;
    }
    .media-card--survey {
      padding: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
    }
    .media-card--finish {
      background: linear-gradient(180deg, #ffffff 0%, #f9fbfe 100%);
    }
    .dark .media-card {
      border-color: var(--line-dark);
      background: rgba(255,255,255,.04);
    }
    .media-card small {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-soft);
      font-weight: 600;
    }
    .dark .media-card small { color: var(--text-light-soft); }
    .media-frame {
      overflow: hidden;
      border-radius: 12px;
      background: #eef3fb;
      border: 1px solid rgba(47,107,255,.08);
    }
    .media-frame--image img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .hero-media-wrap .media-frame--image img {
      height: 240px;
    }
    .option-media-wrap .media-frame--image img {
      height: 132px;
    }
    .media-card audio, .media-card video {
      width: 100%;
      display: block;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .media-card video {
      max-height: 220px;
      object-fit: cover;
    }
    .media-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }
    .media-fallback {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-soft);
      margin-top: 8px;
    }
    .options, .fields, .score-list { display: grid; gap: 12px; }
    .score-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fafbfc;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .score-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }
    .score-scale {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .score-pill {
      min-width: 44px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    .score-pill--card {
      display: inline-grid;
      place-items: center;
      gap: 1px;
      min-width: 52px;
      height: 48px;
      border-radius: 14px;
    }
    .score-pill-value {
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }
    .score-pill-hint {
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      opacity: .72;
    }
    .score-pill.is-active {
      background: var(--brand);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(91,124,255,.22);
    }
    .score-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-soft);
    }
    .option {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fafbfc;
      transition: border-color .18s ease, transform .18s ease, background-color .18s ease, box-shadow .18s ease;
    }
    .option:hover {
      border-color: rgba(47,107,255,.22);
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(31, 35, 41, 0.05);
    }
    .option-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      cursor: pointer;
      width: 100%;
    }
    .option-card input {
      width: 18px;
      min-width: 18px;
      height: 18px;
      margin-top: 4px;
      accent-color: var(--brand);
    }
    .option-card-indicator {
      display: none;
    }
    .option-card-body {
      min-width: 0;
      flex: 1;
      display: grid;
      gap: 12px;
    }
    .option-card-arrow {
      align-self: center;
      color: var(--text-soft);
      font-size: 20px;
      line-height: 1;
      transition: transform .18s ease, color .18s ease;
    }
    .option-copy {
      display: grid;
      gap: 6px;
    }
    .option--media .option-card {
      align-items: flex-start;
    }
    .option:has(input:checked) {
      border-color: rgba(47,107,255,.38);
      background: #f7faff;
      box-shadow: 0 10px 28px rgba(47,107,255,.10);
    }
    .option:has(input:checked) .option-card-arrow {
      color: var(--brand);
      transform: translateX(2px);
    }
    .option--media .option-copy .rich p {
      color: var(--text);
    }
    .option--media .option-media-wrap {
      margin-top: 2px;
    }
    .child-list {
      display: none;
      padding: 0 16px 16px 48px;
      gap: 12px;
    }
    .child-list.is-visible { display: grid; }
    .field { display: grid; gap: 8px; }
    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field-label { font-weight: 700; }
    .input, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      padding: 14px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.75;
    }
    .input:focus, .textarea:focus {
      border-color: rgba(91,124,255,.45);
      box-shadow: 0 0 0 4px rgba(91,124,255,.12);
    }
    .error {
      display: none;
      font-size: 13px;
      line-height: 1.6;
      color: var(--danger);
    }
    .error.is-visible { display: block; }
    .is-hidden-by-logic { display: none !important; }
    .is-invalid {
      border-color: rgba(226,82,112,.5) !important;
      box-shadow: 0 0 0 4px rgba(226,82,112,.08) !important;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .actions-right {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: var(--brand);
      box-shadow: 0 12px 32px rgba(91,124,255,.26);
      cursor: pointer;
    }
    .btn.secondary {
      background: #f2f3f5;
      color: var(--text-soft);
      box-shadow: none;
      border: 1px solid rgba(91,124,255,.12);
    }
    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      box-shadow: none;
    }
    body[data-style-pack="consumer-campaign"] .topbar .badge:first-child {
      background: #ffffff;
      border-color: rgba(134,61,251,.18);
      color: #111111;
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(134, 61, 251, .08);
    }
    body[data-style-pack="consumer-campaign"] .progress {
      height: 10px;
      background: #f1edf9;
    }
    body[data-style-pack="consumer-campaign"] .progress-bar {
      background: linear-gradient(90deg, #000000 0%, #863dfb 100%);
      box-shadow: 0 10px 22px rgba(134, 61, 251, .20);
    }
    body[data-style-pack="consumer-campaign"] .card {
      border-color: rgba(134, 61, 251, .10);
      box-shadow: 0 24px 56px rgba(20, 10, 40, 0.08);
    }
    body[data-style-pack="consumer-campaign"] .card.dark {
      background:
        radial-gradient(circle at top right, rgba(134,61,251,.10), transparent 24%),
        radial-gradient(circle at bottom left, rgba(134,61,251,.05), transparent 22%),
        linear-gradient(180deg, #ffffff 0%, #ffffff 100%);
    }
    body[data-style-pack="consumer-campaign"] .survey-kicker,
    body[data-style-pack="consumer-campaign"] .finish-kicker {
      background: #f4efff;
      color: #5d23bd;
    }
    body[data-style-pack="consumer-campaign"] .survey-hero,
    body[data-style-pack="consumer-campaign"] .finish-state {
      gap: 18px;
    }
    body[data-style-pack="consumer-campaign"] .survey-hero-copy .rich h1 {
      font-size: 40px;
